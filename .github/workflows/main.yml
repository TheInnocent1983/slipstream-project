name: "godot-ci-export"
on: [push, pull_request]

jobs:
  export-game:
    runs-on: ubuntu-latest
    name: Export Game
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: godot-export
        uses: firebelley/godot-export@v5.2.1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          relative_export_path: builds/linux

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Build
          path: builds/linux/

      - name: godot-windows-export
        uses: firebelley/godot-export@v5.2.1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          use_preset_export_path: true

      - name: upload-windows-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: builds/windows/

      - name: create-build-dir
        run: mkdir -p builds/linux builds/windows
